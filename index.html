<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://open.er-api.com; worker-src 'self' blob:; manifest-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Subscrap — 영수증만 연결하면 숨은 구독을 찾아 아껴주는 구독 관리 앱">
<title>Subscrap — 구독 관리</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F7FB; --surface2:#EDF1F8; --text:#1A2130; --text-sub:#5A6478;
  --primary:#1F3864; --accent:#2E74B5; --danger:#B00020; --success:#2E7D32; --warn:#B26A00;
  --line:#DDE3EE; --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.06);
  --r:14px; --rs:10px; --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#0F1420; --surface:#1A2130; --surface2:#232C3E; --text:#ECF0F7; --text-sub:#9AA4B8;
  --primary:#7FA8E0; --accent:#5B9BD5; --danger:#FF6B6B; --success:#66BB6A; --warn:#E0A458;
  --line:#2C3648; --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
 font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:720px;margin:0 auto;padding:0 16px calc(86px + var(--safe-b));min-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 0 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.head h1{font-size:1.47rem;margin:0;letter-spacing:-.02em}
.head .sub{font-size:12px;color:var(--text-sub);margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--text);font-size:17px}
.iconbtn:active{background:var(--surface2)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--text-sub)}
.tiny{font-size:.8rem}
.sm{font-size:.867rem}
.b{font-weight:700}
.center{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

.total{font-size:2.53rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.delta{font-size:13px;font-weight:700;display:inline-flex;gap:4px;align-items:center;padding:3px 9px;border-radius:99px}
.delta.up{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.delta.down{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.delta.flat{color:var(--text-sub);background:var(--surface2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:12px;
 background:var(--primary);color:#fff;font-weight:700;font-size:15px;min-height:46px;width:100%}
html[data-theme="dark"] .btn{color:#0F1420}
.btn.ghost{background:var(--surface2);color:var(--text)}
html[data-theme="dark"] .btn.ghost,html[data-theme="dark"] .btn.line{color:var(--text)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:9px 13px;min-height:38px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}

.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--text-sub);white-space:nowrap}
.badge.red{background:color-mix(in srgb,var(--danger) 14%,transparent);color:#8F0019}
.badge.green{background:color-mix(in srgb,var(--success) 15%,transparent);color:#1F5C23}
.badge.amber{background:color-mix(in srgb,var(--warn) 16%,transparent);color:#6E4300}
.badge.blue{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--primary)}
html[data-theme="dark"] .badge.red{color:#FF9B9B}
html[data-theme="dark"] .badge.green{color:#93D796}
html[data-theme="dark"] .badge.amber{color:#F0C68C}
html[data-theme="dark"] .badge.blue{color:#A8C8EE}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-sub);font-size:10.5px;font-weight:600}
.tab .ic{font-size:19px;line-height:1}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;transform:translate(12px,-4px);width:7px;height:7px;border-radius:99px;background:var(--danger)}

.sheet-bg{position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:80;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--bg);border-radius:20px 20px 0 0;
 max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 12px}

.inp{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);min-height:46px}
.inp:focus{border-color:var(--accent);outline:none}
label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--text-sub);margin:12px 0 5px}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text-sub)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:var(--shadow)}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;border:1.5px solid transparent}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--primary);font-weight:800}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .16s}
.switch[aria-checked="true"]{background:var(--success)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:transform .16s}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gcell{background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid transparent}
.gcell[aria-pressed="true"]{border-color:var(--accent)}
.gcell .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.2;color:var(--text-sub)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-sub);padding:5px 0}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface);display:flex;flex-direction:column;align-items:center;
 justify-content:flex-start;padding:4px 2px;gap:2px;font-size:11px;position:relative}
.cal .d.out{color:var(--text-sub);background:transparent}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d .pips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .d .pip{width:6px;height:6px;border-radius:99px}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
 background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:38px 20px;color:var(--text-sub)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}

.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.stat{background:var(--surface);border-radius:12px;padding:11px}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:11px;color:var(--text-sub);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(14px);
 background:var(--text);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:13.5px;font-weight:600;
 z-index:120;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#installBanner{position:fixed;left:12px;right:12px;bottom:calc(78px + var(--safe-b));z-index:60;background:var(--surface);
 border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);display:none;max-width:696px;margin:0 auto}
#installBanner.on{display:block}
.ol{padding-left:20px;margin:8px 0}
.ol li{margin:5px 0}
.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px;padding:1px 5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<div id="installBanner" role="complementary"></div>

const BACKUP_SCHEMA="subscrap-backup/v2";
const BACKUP_VERSION=2;
const RECOVERY_KEY="subscrap.v1.recovery";
function cloneJSON(value){return JSON.parse(JSON.stringify(value))}
function backupChecksum(data){
 const s=JSON.stringify(data);let h=2166136261;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
 return (h>>>0).toString(16).padStart(8,"0")
}
function normalizeStoredData(value,defaults){
 const out=value&&typeof value==="object"&&!Array.isArray(value)?cloneJSON(value):{};
 for(const k in defaults)if(out[k]===undefined)out[k]=cloneJSON(defaults[k]);
 if(!out.set||typeof out.set!=="object"||Array.isArray(out.set))out.set={};
 for(const k in defaults.set)if(out.set[k]===undefined)out.set[k]=cloneJSON(defaults.set[k]);
 if(!out.set.alerts||typeof out.set.alerts!=="object"||Array.isArray(out.set.alerts))out.set.alerts={};
 for(const k in defaults.set.alerts)if(out.set.alerts[k]===undefined)out.set.alerts[k]=defaults.set.alerts[k];
 return out;
}
function validateStoredData(d){
 if(!d||typeof d!=="object"||Array.isArray(d))return false;
 const arrays=["subs","savings","receipts","events"];
 if(arrays.some(k=>!Array.isArray(d[k])))return false;
 if(d.subs.length>10000||d.receipts.length>100000||d.events.length>10000)return false;
 const cycles=new Set(["weekly","monthly","yearly","custom_days"]);
 const statuses=new Set(["active","trial","paused","canceled","needs_review"]);
 return d.subs.every(s=>s&&typeof s==="object"&&typeof s.id==="string"&&s.id.length<=100&&
  Number.isFinite(s.amountMinor)&&s.amountMinor>=0&&typeof s.currency==="string"&&s.currency.length<=8&&
  cycles.has(s.cycle)&&statuses.has(s.status));
}
function createBackupEnvelope(data){
 const copy=cloneJSON(data);
 return{schema:BACKUP_SCHEMA,version:BACKUP_VERSION,appVersion:VERSION,
  exportedAt:new Date().toISOString(),checksum:backupChecksum(copy),data:copy};
}
function parseBackupDocument(raw){
 const parsed=typeof raw==="string"?JSON.parse(raw):cloneJSON(raw);
 let data=parsed;
 if(parsed&&parsed.schema===BACKUP_SCHEMA){
  if(parsed.version!==BACKUP_VERSION||!parsed.data||parsed.checksum!==backupChecksum(parsed.data))throw new Error("backup integrity");
  data=parsed.data;
 }else if(!parsed||!Array.isArray(parsed.subs))throw new Error("backup schema");
 const normalized=normalizeStoredData(data,DB.def());
 if(!validateStoredData(normalized))throw new Error("backup data");
 return normalized;
}

const FX_FALLBACK={USD:1,EUR:.92,GBP:.79,JPY:155,KRW:1350,CNY:7.2,TWD:32.3,HKD:7.8,SGD:1.34,THB:35.6,

function minorFactor(c){return decimals(c)===0?1:100}

const DB={ // 저장소 (게스트 모드 = 로컬 저장, T-209)
 key:"subscrap.v1",

function saveRecoverySnapshot(reason){

  localStorage.setItem(RECOVERY_KEY,JSON.stringify(envelope));return true}catch(e){return false}

function hasRecoverySnapshot(){try{return!!localStorage.getItem(RECOVERY_KEY)}catch(e){return false}}
function restoreRecoverySnapshot(){
 try{const raw=localStorage.getItem(RECOVERY_KEY);if(!raw)return false;
  const restored=parseBackupDocument(raw),current=cloneJSON(DB.d);DB.d=restored;
  if(!DB.save()){DB.d=current;return false}localStorage.removeItem(RECOVERY_KEY);return true;

}

/* convert(amountMinor, from, to) → null 이면 합산 제외 (T-009 계약) */
function convert(minor,from,to){
 if(from===to)return minor;
 const R=rates(); if(!R[from]||!R[to])return null;
 const units=minor/minorFactor(from);
 const usd=units/R[from];
 const out=usd*R[to];
 return Math.round(out*minorFactor(to));
}
function fmt(minor,cur){
 const v=minor/minorFactor(cur);
 try{return new Intl.NumberFormat(LANG==="ko"?"ko-KR":"en-US",{style:"currency",currency:cur,
   minimumFractionDigits:decimals(cur),maximumFractionDigits:decimals(cur)}).format(v)}
 catch(e){return cur+" "+v.toFixed(decimals(cur))}
}

const DAY=864e5;
function iso(d){return new Date(d).toISOString().slice(0,10)}
function addMonthsClamped(d,n){
 const x=new Date(d),day=x.getUTCDate();
 x.setUTCDate(1);x.setUTCMonth(x.getUTCMonth()+n);
 const last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();

}
function computeNextBilling(first,cycle,cycleDays,now){

 while(next<=N&&guard++<3000){
  if(cycle==="weekly")next=new Date(+next+7*DAY);
  else if(cycle==="monthly")next=addMonthsClamped(next,1);
  else if(cycle==="yearly")next=addMonthsClamped(next,12);
  else next=new Date(+next+(cycleDays||30)*DAY);

}
function monthlyMinor(s){ // 월 환산 (T-010 규칙)

}

function editDist(a,b){

 if(Math.abs(a.length-b.length)>2)return 9;
 const dp=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
  dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[a.length][b.length]}

   text:t("fam.title")+" — "+t("fam.save",{a:fmt(fo.saveYear,fo.cur)}),gain:fo.saveYear,cur:fo.cur});
  // T-307 연간 전환 — 프리셋(USD)을 사용자 통화로 환산해 비교 (BUG-005 수정)
  const cat=CATMAP[s.slug];
  if(s.cycle==="monthly"&&s.status==="active"&&cat&&cat.p){
   const yr=cat.p.find(p=>p.cy==="yearly");
   if(yr){const yrConv=convert(yr.m,"USD",s.currency);
    if(yrConv!==null){const gain=s.amountMinor*12-yrConv;
     if(gain>=s.amountMinor)out.push({id:"ann:"+s.id,kind:"annual",subId:s.id,
       text:t("flag.annual",{a:fmt(gain,s.currency)}),gain,cur:s.currency});}}}
 });
 bundleOffers().forEach(b=>out.push({id:"bun:"+b.name,kind:"bundle",subId:b.ids[0],
  text:t("bundle.title")+" "+b.name+" — "+t("flag.annual",{a:fmt(b.saveYear,b.cur)}),gain:b.saveYear,cur:b.cur}));
 return out.filter(f=>!DB.d.flags[f.id]).sort((a,b)=>{
  const ga=convert(a.gain,a.cur,DB.d.set.base)||0,gb=convert(b.gain,b.cur,DB.d.set.base)||0;return gb-ga;});
}
const POPULAR_BY_COUNTRY={
 KR:["netflix","youtube-premium","coupang","chatgpt","tving","melon","claude","wavve","naver-plus","icloud","millie","baemin-club"],
 JP:["netflix","youtube-premium","spotify","amazon-prime","chatgpt","icloud","abema","disney-plus","claude","dazn","apple-music","notion"],
 US:["netflix","spotify","chatgpt","prime-video","icloud","hulu","disney-plus","claude","hbo-max","youtube-premium","google-one","notion"],
 GB:["netflix","spotify","prime-video","chatgpt","disney-plus","icloud","now-tv","claude","youtube-premium","google-one","notion","apple-music"],
 DE:["netflix","spotify","prime-video","chatgpt","disney-plus","icloud","dazn","claude","youtube-premium","google-one","notion","apple-music"],
 IN:["netflix","spotify","prime-video","chatgpt","disney-plus","youtube-premium","google-one","claude","icloud","notion","canva","crunchyroll"],
 BR:["netflix","spotify","prime-video","chatgpt","disney-plus","youtube-premium","google-one","claude","icloud","hbo-max","canva","notion"],
};
function popularFor(country){
 const list=POPULAR_BY_COUNTRY[country]||POPULAR_BY_COUNTRY.US;
 const valid=list.filter(s=>CATMAP[s]);
 const fill=["netflix","spotify","chatgpt","claude","notion","icloud","youtube-premium","disney-plus","figma","google-one","apple-music","canva"];
 fill.forEach(s=>{if(valid.length<12&&CATMAP[s]&&!valid.includes(s))valid.push(s)});
 return valid.slice(0,12)}
function catName(c){const m={ai:LANG==="ko"?"AI":"AI",entertainment:LANG==="ko"?"엔터테인먼트":"Entertainment",
 productivity:LANG==="ko"?"생산성":"Productivity",cloud:LANG==="ko"?"클라우드":"Cloud",other:LANG==="ko"?"기타":"Other"};
 return m[c]||c}

/* ---------- 알림 정책 엔진 (T-206) ---------- */
function pendingAlerts(){
 const A=DB.d.set.alerts,out=[];
 activeSubs().forEach(s=>{
  const d=daysUntil(s.nextBillingAt);
  if(A.billing&&d>=0&&d<=A.billingDays)
   out.push({type:"billing",pri:2,subId:s.id,text:LANG==="ko"
     ?`${subName(s)} ${d===0?"오늘":"D-"+d} 결제 — ${fmt(s.amountMinor,s.currency)}`
     :`${subName(s)} renews ${d===0?"today":"in "+d+"d"} — ${fmt(s.amountMinor,s.currency)}`});
  if(A.trial&&s.trialEndAt){const td=daysUntil(s.trialEndAt);
   if(td>=0&&td<=A.trialDays)out.push({type:"trial",pri:1,subId:s.id,text:LANG==="ko"
     ?`${subName(s)} 무료 체험이 ${td===0?"오늘":td+"일 뒤"} 끝나요`
     :`${subName(s)} free trial ends ${td===0?"today":"in "+td+" days"}`});}
 });
 if(A.price)list0().forEach(s=>{
  const h=s.priceHistory||[];if(h.length<2)return;
  const last=h[h.length-1],prev=h[h.length-2];
  if(last.minor>prev.minor&&(Date.now()-new Date(last.at))<30*DAY)
   out.push({type:"price",pri:3,subId:s.id,text:LANG==="ko"
     ?`${subName(s)} 가격 인상: ${fmt(prev.minor,s.currency)} → ${fmt(last.minor,s.currency)}`
     :`${subName(s)} price up: ${fmt(prev.minor,s.currency)} → ${fmt(last.minor,s.currency)}`});
 });
 function list0(){return activeSubs()}
 activeSubs().forEach(s=>{if(!s.endAt)return;const ed=daysUntil(s.endAt);
  if(ed>=0&&ed<=7)out.push({type:"end",pri:2,subId:s.id,text:LANG==="ko"
    ?`${subName(s)} 약정이 ${ed===0?"오늘":ed+"일 뒤"} 끝나요`
    :`${subName(s)} contract ends ${ed===0?"today":"in "+ed+"d"}`})});
 const cards=DB.d.cards||{};
 Object.entries(cards).forEach(([name,mmyy])=>{
  const st=cardStatus(mmyy);if(!st)return;
  if(st.expired)out.push({type:"card",pri:2,subId:null,text:t("card.exp",{n:name})});
  else if(st.soon)out.push({type:"card",pri:4,subId:null,text:t("card.soon",{n:name})})});
 const fs=fxShift();
 if(fs)out.push({type:"fx",pri:6,subId:null,text:t(fs.up?"fx.up":"fx.down",{c:fs.cur})});
 if(A.dup||A.zombie)detectWaste().forEach(f=>{
  if(f.kind==="dup"&&A.dup)out.push({type:"dup",pri:4,subId:f.subId,text:f.text});
  if(f.kind==="zombie"&&A.zombie)out.push({type:"zombie",pri:5,subId:f.subId,text:f.text});
 });
 // 스로틀: 우선순위 정렬 후 3건 (T-206 정책)
 return out.sort((a,b)=>a.pri-b.pri).slice(0,3);
}

const EVENTS=["onboarding_step_completed","subscription_confirmed","subscription_deleted","cancel_journey_started",
 "cancel_completed","price_increase_noted","report_viewed","calendar_viewed","waste_dismissed","install_prompted",
 "install_accepted","theme_changed","lang_changed","export_csv","assistant_opened",
 "sub_paused","sub_resumed","csv_imported","share_card_saved","help_opened","memo_saved",
 "usage_marked","dup_warned","statement_parsed","backup_exported","backup_restored","records_tidied","wrapped_viewed",
 "share_set","settlement_viewed","timeline_viewed","card_saved","fuzzy_search_hit",
 "review_confirmed","review_rejected","family_offer_seen","bundle_offer_seen","widget_viewed"];
function track(name,props){
 if(!EVENTS.includes(name))return; // 택소노미 밖 이벤트 차단 (T-208 계약)
 DB.d.events.push({n:name,p:props||{},ts:Date.now()});
 if(DB.d.events.length>500)DB.d.events=DB.d.events.slice(-500);
}

function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");
 clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2200)}

 if(v==="calendar")track("calendar_viewed");if(v==="report")track("report_viewed")}

function inkFor(hex){try{const h=hex.replace("#","");const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
 const L=[r,g,b].map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
 const lum=.2126*L[0]+.7152*L[1]+.0722*L[2];
 /* 흰 글자 대비 4.5:1 경계(밝기 0.183) */ return lum>.18?"#10151F":"#FFFFFF";}catch(e){return "#FFFFFF"}}
function avatar(s,size){const n=subName(s),ini=n.replace(/[^A-Za-z0-9가-힣]/g,"").slice(0,2).toUpperCase()||"S";
 const bg=subColor(s);
 return `<div class="avatar" style="background:${esc(bg)};color:${inkFor(bg)};${size?`width:${size}px;height:${size}px;font-size:${size/2.6}px`:""}" aria-hidden="true">${esc(ini)}</div>`}
function cycLabel(s){if(s.cycle==="custom_days")return `${s.cycleDays}${LANG==="ko"?"일마다":"d"}`;

 // 나눠 내기 요약

 // 알림 (T-206)

 if(al.length){h+=`<div class="card" style="border-left:4px solid var(--accent)">`+

function mergeDuplicateFlag(flagId){

function viewCalendar(){
 const y=CALM.getFullYear(),m=CALM.getMonth();
 const first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());
 const subs=activeSubs(),map={};
 subs.forEach(s=>{ // 12개월 전개
  let d=new Date(s.nextBillingAt),g=0;
  const back=new Date(s.nextBillingAt);
  // 과거 방향 채우기(현재 월 표시용)
  let bd=new Date(back);
  while(bd>new Date(y,m-1,1)&&g++<40){
   if(s.cycle==="weekly")bd=new Date(+bd-7*DAY);
   else if(s.cycle==="monthly")bd=addMonthsClamped(bd,-1);
   else if(s.cycle==="yearly")bd=addMonthsClamped(bd,-12);
   else bd=new Date(+bd-(s.cycleDays||30)*DAY);
   const k=iso(bd);(map[k]=map[k]||[]).push(s);
  }
  g=0;
  while(g++<40&&d<new Date(y,m+2,1)){
   const k=iso(d);(map[k]=map[k]||[]).push(s);
   if(s.cycle==="weekly")d=new Date(+d+7*DAY);
   else if(s.cycle==="monthly")d=addMonthsClamped(d,1);
   else if(s.cycle==="yearly")d=addMonthsClamped(d,12);
   else d=new Date(+d+(s.cycleDays||30)*DAY);
  }
 });
 // 이번 주 합계
 const now=new Date(),wS=new Date(now);wS.setDate(now.getDate()-now.getDay());
 let weekTotal=0;
 for(let i=0;i<7;i++){const k=iso(new Date(+wS+i*DAY));(map[k]||[]).forEach(s=>{
   const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)weekTotal+=c})}
 const mn=LANG==="ko"?`${y}년 ${m+1}월`:new Date(y,m,1).toLocaleString("en-US",{month:"long",year:"numeric"});
 let h=`<div class="head"><div><h1>${t("cal.title")}</h1>
   <div class="sub">${t("cal.week")} <b>${fmt(weekTotal,DB.d.set.base)}</b></div></div></div>
  <div class="card"><div class="row between mb">
   <button class="iconbtn" onclick="calMove(-1)" aria-label="이전 달">‹</button>
   <div class="b">${esc(mn)}</div>
   <button class="iconbtn" onclick="calMove(1)" aria-label="다음 달">›</button></div>
  <div class="cal">`;
 (LANG==="ko"?["일","월","화","수","목","금","토"]:["S","M","T","W","T","F","S"]).forEach(d=>h+=`<div class="dow">${d}</div>`);
 const today=iso(new Date());
 const dayTot={};let maxTot=0;
 Object.keys(map).forEach(k=>{let tt=0;map[k].forEach(s=>{const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)tt+=c});
  dayTot[k]=tt;if(tt>maxTot)maxTot=tt});
 for(let i=0;i<42;i++){const d=new Date(+start+i*DAY),k=iso(d),out=d.getMonth()!==m;
  const items=map[k]||[];
  const heat=maxTot>0&&dayTot[k]?Math.max(8,Math.round(dayTot[k]/maxTot*34)):0;
  h+=`<button class="d ${out?"out":""} ${k===today?"today":""}" ${heat?`style="background:color-mix(in srgb,var(--accent) ${heat}%,var(--surface))"`:""} onclick="calDay('${k}')" aria-label="${k}">
   <div>${d.getDate()}</div><div class="pips">`+
   items.slice(0,4).map(s=>`<i class="pip" style="background:${esc(subColor(s))}"></i>`).join("")+
   (items.length>4?`<span class="tiny" style="font-size:8px">+${items.length-4}</span>`:"")+`</div></button>`}
 h+=`</div></div>
 <div class="tiny muted center">${LANG==="ko"?"날짜를 누르면 그날 결제 내역을 볼 수 있어요":"Tap a day to see what's due"}</div>`;
 return h;
}
function calMove(n){CALM=new Date(CALM.getFullYear(),CALM.getMonth()+n,1);render()}
function calDay(k){
 const subs=activeSubs().filter(s=>{
  let d=new Date(s.nextBillingAt),g=0;const target=new Date(k);
  // 정확 일치 탐색 (앞뒤 24회)
  let b=new Date(s.nextBillingAt);
  for(let i=0;i<40;i++){if(iso(b)===k)return true;
   if(s.cycle==="weekly")b=new Date(+b-7*DAY);else if(s.cycle==="monthly")b=addMonthsClamped(b,-1);
   else if(s.cycle==="yearly")b=addMonthsClamped(b,-12);else b=new Date(+b-(s.cycleDays||30)*DAY);
   if(b<new Date(s.firstBilledAt))break;}
  for(let i=0;i<40;i++){if(iso(d)===k)return true;
   if(s.cycle==="weekly")d=new Date(+d+7*DAY);else if(s.cycle==="monthly")d=addMonthsClamped(d,1);
   else if(s.cycle==="yearly")d=addMonthsClamped(d,12);else d=new Date(+d+(s.cycleDays||30)*DAY);}
  return false});
 let tot=0;subs.forEach(s=>{const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)tot+=c});
 let h=`<div class="grab"></div><div class="row between mb"><div class="b">${esc(k)}</div>
  <div class="b">${fmt(tot,DB.d.set.base)}</div></div>`;
 h+=subs.length?subs.map(s=>`<button class="card row" style="width:100%;text-align:left" onclick="closeSheet();openDetail('${s.id}')">
   ${avatar(s,36)}<div class="grow"><div class="b sm">${esc(subName(s))}</div>
   <div class="tiny muted">${cycLabel(s)}</div></div><div class="b">${fmt(s.amountMinor,s.currency)}</div></button>`).join("")
  :`<div class="empty"><div class="big">🌤</div><div class="sm">${t("cal.none")}</div></div>`;
 openSheet(h);
}

function resetAll(){if(!confirm(LANG==="ko"?"모든 구독 데이터가 사라져요. 정말 삭제할까요?":"This deletes everything. Continue?"))return;

 localStorage.removeItem(DB.key);DB.load();applyTheme();toast(t("t.deleted"));go("home")}
function importCSV(ev){
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const lines=String(rd.result).replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());
   const head=lines[0].toLowerCase();
   const rows=head.includes("name")&&head.includes("amount")?lines.slice(1):lines;
   let n=0,skip=0;
   rows.forEach(line=>{
    const cols=line.match(/("([^"]|"")*"|[^,]*)/g).filter(x=>x!=="").map(x=>x.replace(/^"|"$/g,"").replace(/""/g,'"'));
    if(cols.length<3){skip++;return}
    const name=cols[0].trim(),amt=parseFloat(cols[1]),cur=(cols[2]||"USD").trim().toUpperCase();
    const cyc=["weekly","monthly","yearly","custom_days"].includes((cols[3]||"").trim())?cols[3].trim():"monthly";
    if(!name||!(amt>0)||!CURRENCIES.includes(cur)){skip++;return}
    const hit=CATALOG.find(c=>c.n.toLowerCase()===name.toLowerCase());
    addSub({slug:hit?hit.s:null,customName:hit?null:name,amountMinor:Math.round(amt*minorFactor(cur)),
     currency:cur,cycle:cyc,firstBilledAt:(cols[4]&&/^\d{4}-\d{2}-\d{2}$/.test(cols[4].trim()))?cols[4].trim():iso(new Date())});
    n++;
   });
   track("csv_imported",{n});toast(t("t.imported",{n,s:skip}));render();
  }catch(e){toast(LANG==="ko"?"파일을 읽지 못했어요 — CSV 형식을 확인해주세요":"Could not read that file")}
  ev.target.value="";
 };
 rd.readAsText(f);
}

function importBackup(ev){
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 if(f.size>5*1024*1024){toast(LANG==="ko"?"백업 파일은 5MB까지 불러올 수 있어요":"Backup files are limited to 5MB");ev.target.value="";return}
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const d=parseBackupDocument(String(rd.result));
   if(!confirm(LANG==="ko"?`지금 데이터를 백업본(구독 ${d.subs.length}개)으로 바꿉니다. 계속할까요?`
     :`Replace current data with backup (${d.subs.length} subs)?`))return;
   if(!saveRecoverySnapshot("restore"))throw new Error("recovery");
   const previous=cloneJSON(DB.d);DB.d=d;
   if(!DB.save()){DB.d=previous;throw new Error("storage")}
   LANG=DB.d.set.lang||LANG;applyTheme();applyFont();
   track("backup_restored",{n:d.subs.length});toast(t("t.restored",{n:d.subs.length}));render();
  }catch(e){toast(LANG==="ko"?"백업 파일이 아니거나 손상됐어요":"Not a valid backup file")}
  ev.target.value="";
 };
 rd.readAsText(f);
}

function scanPaste(){
 const txt=($("pastebox").value||"");
 const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const found=[];
 lines.forEach(line=>{
  const am=line.match(/(?:US\$|\$|€|£|₩|¥|KRW|USD)\s?([0-9][0-9,]*\.?[0-9]{0,2})/i);
  if(!am)return;
  const raw=am[1].replace(/,/g,"");const val=parseFloat(raw);
  if(!(val>0))return;
  const isK=/₩|KRW/i.test(am[0]),isJ=/¥/.test(am[0]),isE=/€/.test(am[0]),isG=/£/.test(am[0]);
  const cur=isK?"KRW":isJ?"JPY":isE?"EUR":isG?"GBP":"USD";
  let name=line.replace(am[0],"").replace(/[0-9]{2}[-\/.][0-9]{2}([-\/.][0-9]{2,4})?/g,"")
   .replace(/[|,\t]+/g," ").replace(/\s{2,}/g," ").trim().slice(0,40);
  const hit=CATALOG.find(c=>{const n=name.toLowerCase();
   return n.includes(c.n.toLowerCase())||c.a.some(a=>a&&n.includes(a.toLowerCase()))});
  if(hit)name=hit.n;
  if(!name)return;
  found.push({name,slug:hit?hit.s:null,minor:(cur==="KRW"||cur==="JPY")?Math.round(val):Math.round(val*100),cur});
 });
 track("statement_parsed",{n:found.length});
 const box=$("pasteres");
 if(!found.length){box.innerHTML=`<div class="card flat center sm muted">${t("paste.none")}</div>`;return}
 window.__pasteFound=found;

function obToggle(sl){OBPICK.has(sl)?OBPICK.delete(sl):OBPICK.add(sl);render()}
function obFinish(){

/* ---------------- 시트 ---------------- */
function openSheet(html){$("sheet").innerHTML=html;$("sheet").classList.add("on");$("sheetBg").classList.add("on");
 document.body.style.overflow="hidden"}
function closeSheet(){$("sheet").classList.remove("on");$("sheetBg").classList.remove("on");
 document.body.style.overflow="";setTimeout(()=>{if(!$("sheet").classList.contains("on"))$("sheet").innerHTML=""},250)}

/* ---------------- 라우팅 ---------------- */
function render(){
 if(!DB.d.set.onboarded){$("app").innerHTML=viewOnboard();$("tabs").style.display="none";return}
 $("tabs").style.display="";
 rollForward();
 const v={home:viewHome,calendar:viewCalendar,add:viewAdd,report:viewReport,settings:viewSettings}[VIEW]||viewHome;
 $("app").innerHTML=v();
 const alerts=pendingAlerts().length;
 $("tabsIn").innerHTML=[["home","⌂","tab.home"],["calendar","▦","tab.calendar"],["add","＋","tab.add"],
  ["report","◫","tab.report"],["settings","⚙","tab.settings"]].map(([k,ic,lb])=>
  `<button class="tab" ${VIEW===k?'aria-current="page"':""} onclick="go('${k}')">
   <span class="ic">${ic}</span>${k==="home"&&alerts?`<span class="dot"></span>`:""}<span>${t(lb)}</span></button>`).join("");
}
</script>

let deferredPrompt=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function bannerSuppressed(){
 try{if(sessionStorage.getItem("scrap.ib.session")==="1")return true;
  const until=parseInt(localStorage.getItem("scrap.ib.until")||"0",10);
  if(until&&Date.now()<until)return true;}catch(e){}
 return false;
}
function suppressBanner(){
 try{sessionStorage.setItem("scrap.ib.session","1");
  localStorage.setItem("scrap.ib.until",String(Date.now()+24*60*60*1000));}catch(e){}
}
function hideBanner(){const b=document.getElementById("installBanner");if(b)b.classList.remove("on")}
function showBanner(html){
 if(isStandalone()||bannerSuppressed())return;
 const b=document.getElementById("installBanner");b.innerHTML=html;b.classList.add("on");
}
function dismissBanner(){suppressBanner();hideBanner()}
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();deferredPrompt=e;
 if(isStandalone())return;
 track("install_prompted",{});
 showBanner(`<div class="row"><div class="grow">
   <div class="b sm">${LANG==="ko"?"홈 화면에 앱으로 추가":"Install Subscrap"}</div>
   <div class="tiny muted">${LANG==="ko"?"앱처럼 열고 알림도 받을 수 있어요":"Open it like an app"}</div></div>
  <button class="btn sm" onclick="doInstall()">${LANG==="ko"?"설치":"Install"}</button>
  <button class="iconbtn" onclick="dismissBanner()" aria-label="${LANG==="ko"?"닫기":"Dismiss"}">✕</button></div>`);
});
async function doInstall(){
 if(!deferredPrompt){showInstallHelp();return}
 hideBanner();deferredPrompt.prompt();
 const {outcome}=await deferredPrompt.userChoice;
 if(outcome==="accepted")track("install_accepted",{});else suppressBanner();
 deferredPrompt=null;
}
window.addEventListener("appinstalled",()=>{deferredPrompt=null;hideBanner();
 try{localStorage.removeItem("scrap.ib.until")}catch(e){}
 toast(LANG==="ko"?"설치했어요! 홈 화면에서 열어보세요":"Installed — open it from your home screen")});

function showInstallHelp(){
 if(isStandalone()){toast(LANG==="ko"?"이미 앱으로 실행 중이에요":"Already running as an app");return}
 if(deferredPrompt){doInstall();return}
 const ios=isIOS();
 openSheet(`<div class="grab"></div>
  <div class="b mb" style="font-size:17px">${LANG==="ko"?"홈 화면에 앱으로 추가하기":"Add to home screen"}</div>
  ${ios?`<ol class="ol sm"><li>${LANG==="ko"?"주소창 아래(또는 위)의 <b>공유 버튼 <span class='hl'>⬆︎</span></b>을 누르세요":"Tap the <b>Share <span class='hl'>⬆︎</span></b> button"}</li>
     <li>${LANG==="ko"?"목록을 내려 <b>‘홈 화면에 추가’</b>를 누르세요":"Scroll and tap <b>Add to Home Screen</b>"}</li>
     <li>${LANG==="ko"?"오른쪽 위 <b>‘추가’</b>를 누르면 끝이에요":"Tap <b>Add</b> — done"}</li></ol>`
   :`<ol class="ol sm"><li>${LANG==="ko"?"브라우저 오른쪽 위 <b>⋮ 메뉴</b>를 누르세요":"Open the browser <b>⋮ menu</b>"}</li>
     <li>${LANG==="ko"?"<b>‘앱 설치’</b> 또는 <b>‘홈 화면에 추가’</b>를 누르세요":"Tap <b>Install app</b> / <b>Add to Home screen</b>"}</li></ol>`}

  const swUrl=`sw.js?v=${encodeURIComponent(VERSION)}`;
