<title>Subscrap — 구독 관리</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F7FB; --surface2:#EDF1F8; --text:#1A2130; --text-sub:#5A6478;
  --primary:#1F3864; --accent:#2E74B5; --danger:#B00020; --success:#2E7D32; --warn:#B26A00;
  --line:#DDE3EE; --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.06);
  --r:14px; --rs:10px; --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#0F1420; --surface:#1A2130; --surface2:#232C3E; --text:#ECF0F7; --text-sub:#9AA4B8;
  --primary:#7FA8E0; --accent:#5B9BD5; --danger:#FF6B6B; --success:#66BB6A; --warn:#E0A458;
  --line:#2C3648; --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
 font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:720px;margin:0 auto;padding:0 16px calc(86px + var(--safe-b));min-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 0 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.head h1{font-size:1.47rem;margin:0;letter-spacing:-.02em}
.head .sub{font-size:12px;color:var(--text-sub);margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--text);font-size:17px}
.iconbtn:active{background:var(--surface2)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.auto-find-card{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;width:100%;padding:18px;margin:2px 0 14px;border-radius:18px;text-align:left;color:#fff;background:linear-gradient(135deg,#18335F 0%,#2E74B5 58%,#4AA8D8 100%);box-shadow:0 8px 24px color-mix(in srgb,#1F3864 28%,transparent)}
.auto-find-card::before{content:"";position:absolute;z-index:-1;width:180px;height:180px;right:-70px;top:-92px;border-radius:50%;background:rgba(255,255,255,.14)}
.auto-find-card::after{content:"";position:absolute;z-index:-1;width:120px;height:120px;left:34%;bottom:-92px;border-radius:50%;background:rgba(255,255,255,.08)}
.auto-find-card:active{transform:translateY(1px)}
.auto-find-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:rgba(255,255,255,.18);font-size:23px}
.auto-find-kicker{font-size:11px;font-weight:800;letter-spacing:.055em;color:rgba(255,255,255,.82)}
.auto-find-title{margin-top:2px;font-size:1.18rem;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.auto-find-copy{margin-top:5px;font-size:.82rem;line-height:1.45;color:rgba(255,255,255,.9)}
.auto-find-privacy{margin-top:7px;font-size:.72rem;font-weight:650;color:rgba(255,255,255,.77)}
.auto-find-cta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px;padding:10px 12px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(8,28,62,.22);font-size:.88rem;font-weight:800}
.auto-find-cta span{font-size:18px;line-height:1}
.discovery-center{margin:2px 0 14px;padding:18px;border:2px solid var(--accent);border-radius:18px;background:var(--surface);overflow-wrap:anywhere}
.discovery-center h2{font-size:1.18rem;margin:4px 0 8px;line-height:1.35}
.discovery-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.discovery-stat{min-width:0;background:var(--bg);padding:9px;border-radius:10px;font-size:.76rem;color:var(--text-sub)}
.discovery-stat strong{display:block;font-size:1.03rem;color:var(--text);margin-top:3px}
.discovery-status{font-size:.84rem;color:var(--text-sub);margin-top:9px;line-height:1.5}
.discovery-center .btn{white-space:normal;min-height:44px}
.home-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
@media(min-width:900px){.discovery-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
html[data-theme="dark"] .auto-find-card{color:#fff;background:linear-gradient(135deg,#355B92 0%,#27669D 58%,#2E89B5 100%)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--text-sub)}
.tiny{font-size:.8rem}
.sm{font-size:.867rem}
.b{font-weight:700}
.center{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

.total{font-size:2.53rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.delta{font-size:13px;font-weight:700;display:inline-flex;gap:4px;align-items:center;padding:3px 9px;border-radius:99px}
.delta.up{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.delta.down{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:12px;
 background:var(--primary);color:#fff;font-weight:700;font-size:15px;min-height:46px;width:100%}

.btn.ghost{background:var(--surface2);color:var(--text)}
html[data-theme="dark"] .btn.ghost,html[data-theme="dark"] .btn.line{color:var(--text)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:9px 13px;min-height:38px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}

.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--text-sub);white-space:nowrap}
.badge.red{background:color-mix(in srgb,var(--danger) 14%,transparent);color:#8F0019}
.badge.green{background:color-mix(in srgb,var(--success) 15%,transparent);color:#1F5C23}
.badge.amber{background:color-mix(in srgb,var(--warn) 16%,transparent);color:#6E4300}
.badge.blue{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--primary)}
html[data-theme="dark"] .badge.red{color:#FF9B9B}
html[data-theme="dark"] .badge.green{color:#93D796}
html[data-theme="dark"] .badge.amber{color:#F0C68C}
html[data-theme="dark"] .badge.blue{color:#A8C8EE}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-sub);font-size:10.5px;font-weight:600}
.tab .ic{font-size:19px;line-height:1}

.tab .dot{position:absolute;transform:translate(12px,-4px);width:7px;height:7px;border-radius:99px;background:var(--danger)}

.sheet-bg{position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:80;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--bg);border-radius:20px 20px 0 0;
 max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 12px}

.inp{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);min-height:46px}
.inp:focus{border-color:var(--accent);outline:none}
label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--text-sub);margin:12px 0 5px}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text-sub)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:var(--shadow)}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;border:1.5px solid transparent}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--primary);font-weight:800}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .16s}
.switch[aria-checked="true"]{background:var(--success)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:transform .16s}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gcell{background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid transparent}
.gcell[aria-pressed="true"]{border-color:var(--accent)}
.gcell .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.2;color:var(--text-sub)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-sub);padding:5px 0}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface);display:flex;flex-direction:column;align-items:center;
 justify-content:flex-start;padding:4px 2px;gap:2px;font-size:11px;position:relative}
.cal .d.out{color:var(--text-sub);background:transparent}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d .pips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .d .pip{width:6px;height:6px;border-radius:99px}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
 background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:38px 20px;color:var(--text-sub)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}

.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.stat{background:var(--surface);border-radius:12px;padding:11px}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:11px;color:var(--text-sub);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(14px);
 background:var(--text);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:13.5px;font-weight:600;
 z-index:120;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#installBanner{position:fixed;left:12px;right:12px;bottom:calc(78px + var(--safe-b));z-index:60;background:var(--surface);
 border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);display:none;max-width:696px;margin:0 auto}
#installBanner.on{display:block}
.ol{padding-left:20px;margin:8px 0}
.ol li{margin:5px 0}
.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px;padding:1px 5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div id="app" role="main"></div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>

<script>
/* Shared pure helpers. No I/O, account data, or inferred exchange rates. */
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.PaymentSignals=factory()})(globalThis,function(){
  const ZERO = new Set(['KRW','JPY','VND','CLP']);
  const THREE = new Set(['BHD','KWD','JOD','OMR','TND']);
  const CODES = 'USD EUR GBP AUD CAD BRL INR THB VND KRW JPY BHD KWD JOD OMR TND CLP IDR CNY TWD HKD SGD MYR PHP NZD MXN ARS COP CHF SEK NOK DKK PLN TRY AED'.split(' ');
  const digits = currency => ZERO.has(currency)?0:THREE.has(currency)?3:2;
  function amount(value,currency){
    currency=String(currency||'').toUpperCase();
    if(!CODES.includes(currency))return null;
    const raw=String(value).trim();
    // Reject ambiguous decimal commas, malformed thousands, negatives and rounding loss.
    if(!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d+)?$/.test(raw))return null;
    const [whole,fraction='']=raw.replace(/,/g,'').split('.'),d=digits(currency);
    if(fraction.length>d&&/[1-9]/.test(fraction.slice(d)))return null;
    const minor=Number(whole)*10**d+Number((fraction.slice(0,d)+'0'.repeat(d)).slice(0,d));
    return Number.isSafeInteger(minor)&&minor>=0?{minor,cur:currency}:null;
  }
  function money(text){
    const codes=CODES.join('|'),num='(\\d[\\d,]*(?:\\.\\d+)?)';
    const pattern=new RegExp('(?:\\b('+codes+')\\s*'+num+'|'+num+'\\s*('+codes+')\\b|(US\\$|A\\$|C\\$|R\\$|\\$|€|£|₩|¥|₹|฿|₫)\\s*'+num+')','i');
    const raw=String(text||''),match=raw.match(pattern);if(!match)return null;
    if(/[-(]\s*$/.test(raw.slice(0,match.index)))return null;
    if(match[1])return amount(match[2],match[1]);
    if(match[4])return amount(match[3],match[4]);
    const symbols={'US$':'USD','A$':'AUD','C$':'CAD','R$':'BRL','$':'USD','€':'EUR','£':'GBP','₩':'KRW','¥':'JPY','₹':'INR','฿':'THB','₫':'VND'};
    return amount(match[6],symbols[match[5].toUpperCase()]||symbols[match[5]]);
  }
  function signal(value){
    const text=String(value||'').toLowerCase();
    // Refund policy footers alone are not refund transactions.
    const refund=/\b(refunded|refund issued|refund receipt|refund completed|payment reversed|charge reversed)\b|환불\s*(완료|처리|영수증)|결제\s*취소/.test(text);
    if(refund)return{kind:'refund',cycle:null,limitations:['refund_not_subscription']};
    if(/\b(one[ -]?time|single purchase|non[ -]?recurring)\b|일회성|단건\s*구매/.test(text))return{kind:'purchase',cycle:null,limitations:['purchase_not_recurring']};
    let cycle=null;
    if(/\b(irregular|usage[ -]based|pay as you go)\b|비정기|사용량/.test(text))cycle='irregular';
    else if(/\b(quarterly|every 3 months|p3m)\b|분기|3개월/.test(text))cycle='quarterly';
    else if(/\b(yearly|annual|annually|p1y)\b|연간|매년/.test(text))cycle='yearly';
    else if(/\b(weekly|p1w)\b|주간|매주/.test(text))cycle='weekly';
    else if(/\b(monthly|p1m)\b|월간|매월|월정액/.test(text))cycle='monthly';
    const recurring=cycle||/\b(subscription|membership|renewal|recurring)\b|구독|정기결제|자동결제|멤버십/.test(text);
    return{kind:recurring?'subscription':'unknown',cycle,limitations:!cycle||cycle==='irregular'?['billing_cycle_requires_review']:[]};
  }
  return {digits,amount,money,signal};
});

/* ============================================================
   Subscrap — single-file PWA  (R1 core)
   구현 티켓: T-008 결제일계산 / T-009 환율 / T-010 대시보드 / T-011 홈
   T-012 추가 / T-013 상세 / T-014 알림 / T-201 국가카탈로그 / T-202 절약원장
   T-203 해지센터 / T-204 중복·좀비 / T-205 캘린더 / T-206 알림v2
   T-207 히스토리 / T-208 애널리틱스 / T-209 온보딩·게스트 / T-210 다크·접근성
   T-211 i18n / T-213 리포트 / T-307 플랜최적화
   ============================================================ */
const VERSION="0.27.4";
/* S1-003: 순수 상태 집계. 연결하지 않은 자료나 알 수 없는 상태를 성공으로 세지 않는다. */
function discoverySummary(input={}){
 const kinds=new Set(["gmail","google_play","apple_import","csv_import"]),states=new Set(["not_started","in_progress","completed","partial","failed","reauth","permission_missing"]);
 const channels=(Array.isArray(input.channels)?input.channels:[]).filter(c=>c&&kinds.has(c.type));
 const count=v=>Number.isSafeInteger(v)&&v>=0?v:0;
 const connected=channels.filter(c=>c.connected===true),errors=connected.filter(c=>["failed","partial"].includes(c.status)||!states.has(c.status));
 const reauth=channels.filter(c=>c.status==="reauth"),success=connected.filter(c=>["completed","partial"].includes(c.status));
 const now=Number.isFinite(input.now)?input.now:Date.now();
 const dates=connected.map(c=>Date.parse(c.lastSuccessAt||"")).filter(n=>Number.isFinite(n)&&n>0&&n<=now);
 const candidates=count(input.candidateCount),running=input.loading===true||channels.some(c=>c.status==="in_progress");
 let state="first";
 if(input.offline)state="offline";
 else if(running)state="progress";
 else if(reauth.length||input.requestError==="reauth")state="reauth";
 else if(errors.length||input.requestError)state=success.length||candidates?"partial":"error";
 else if(candidates)state="review";
 else if(connected.length&&success.length===connected.length)state="complete";
 const action=state==="reauth"?"reconnect":candidates&&["review","partial"].includes(state)?"review":["progress","partial","error","offline"].includes(state)?"continue":"find";
 return{state,action,connectedCount:connected.length,candidateCount:candidates,errorCount:errors.length+reauth.length,lastSuccessAt:dates.length?new Date(Math.max(...dates)).toISOString():null,
  retryable:errors.filter(c=>["gmail","google_play"].includes(c.type)).map(c=>({accountId:c.accountId,type:c.type})),
  unknownChannels:(Array.isArray(input.channels)?input.channels:[]).length-channels.length};
}

function discoveryChannels(accounts=[],reports=[],now=Date.now()){
 const result=[];
 for(const account of Array.isArray(accounts)?accounts:[]){
  if(!account||typeof account.id!=="string")continue;
  const sources=Array.isArray(account.sources)?account.sources:[];
  for(const [type,key,time] of [["gmail","gmail","lastGmailScanAt"],["google_play","play","lastPlayImportAt"]]){
   const connected=type==="gmail"?sources.includes("gmail"):sources.some(s=>["play_subscriptions","play_purchases"].includes(s));
   const status=account.scanStatus?.[key]||(connected?(account[time]?"completed":"not_started"):"permission_missing");
   result.push({type,accountId:account.id,accountLabel:String(account.email||""),connected,status,lastSuccessAt:account[time]||null});
  }
 }
 for(const type of ["apple_import","csv_import"]){

const DAY=864e5;
function iso(d){return new Date(d).toISOString().slice(0,10)}
function addMonthsClamped(d,n){
 const x=new Date(d),day=x.getUTCDate();
 x.setUTCDate(1);x.setUTCMonth(x.getUTCMonth()+n);
 const last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();
 x.setUTCDate(Math.min(day,last));return x;
}
function computeNextBilling(first,cycle,cycleDays,now){
 let next=new Date(first);const N=new Date(now);let guard=0;
 while(next<=N&&guard++<3000){
  if(cycle==="weekly")next=new Date(+next+7*DAY);
  else if(cycle==="monthly")next=addMonthsClamped(next,1);
  else if(cycle==="yearly")next=addMonthsClamped(next,12);
  else next=new Date(+next+(cycleDays||30)*DAY);
 }
 return next;
}
function monthlyMinor(s){ // 월 환산 (T-010 규칙)
 const a=s.amountMinor;
 if(s.cycle==="weekly")return Math.round(a*52/12);
 if(s.cycle==="monthly")return a;
 if(s.cycle==="yearly")return Math.round(a/12);
 return Math.round(a*(365.25/(s.cycleDays||30))/12);
}
function yearlyMinor(s){return monthlyMinor(s)*12}
function daysUntil(d){return Math.ceil((new Date(d)-new Date(iso(new Date())))/DAY)}

 const seenReceipts=new Set();DB.d.receipts=DB.d.receipts.filter(r=>{

  const oldR=prev.rates[c],newR=R[c];if(!oldR||!newR)continue;
  const chg=(oldR-newR)/oldR; // 환율(1USD당 c) 하락 = c 강세 = 내 부담 증가

/* 검색 오타 보정 — 두 글자 이내 차이면 같은 것으로 본다 */
function editDist(a,b){
 a=a.toLowerCase();b=b.toLowerCase();
 if(Math.abs(a.length-b.length)>2)return 9;
 const dp=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
  dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[a.length][b.length]}

function makePriceObservation(input){
 const amountMinor=Number(input?.amountMinor),currency=String(input?.currency||'').toUpperCase(),observedAt=String(input?.observedAt||new Date().toISOString());
 if(!Number.isSafeInteger(amountMinor)||amountMinor<0||!CURRENCIES.includes(currency)||!Number.isFinite(Date.parse(observedAt)))return null;
 const allowedSource=new Set(["legacy","manual_edit","receipt","google_play","apple_import","csv_import","system"]),allowedReason=new Set(["initial","plan_price_change","tax_change","discount_ended","fx_conversion","refund","unknown"]),minor=k=>input[k]==null?null:Number(input[k]);
 const out={id:String(input.id||uid()).slice(0,100),observedAt,amountMinor,currency,source:allowedSource.has(input.source)?input.source:"system",reason:allowedReason.has(input.reason)?input.reason:"unknown",baseMinor:minor("baseMinor"),taxMinor:minor("taxMinor"),discountMinor:minor("discountMinor"),nextExpectedAt:input.nextExpectedAt?String(input.nextExpectedAt):null,nextExpectedMinor:minor("nextExpectedMinor")};
 if(!["baseMinor","taxMinor","discountMinor","nextExpectedMinor"].every(k=>out[k]==null||Number.isSafeInteger(out[k])&&out[k]>=0)||out.nextExpectedAt&&!Number.isFinite(Date.parse(out.nextExpectedAt)))return null;
 return out;
}
function priceObservationList(s){

 (s.priceHistory||[]).forEach((p,i)=>{const key=[p.at,p.minor,s.currency].join('|');if(!known.has(key)){const row=makePriceObservation({id:`legacy-runtime-${i}`,observedAt:p.at,amountMinor:p.minor,currency:s.currency,source:'legacy',reason:i===0?'initial':'unknown'});if(row)list.push(row)}});
 return list.sort((a,b)=>Date.parse(a.observedAt)-Date.parse(b.observedAt));
}
function recordPriceObservation(s,input){

 if(row.reason==='refund'||row.source==='system'&&row.reason==='fx_conversion')return row;
 if((s.priceObservations||[]).some(p=>[p.observedAt,p.amountMinor,p.currency,p.reason].join('|')===[row.observedAt,row.amountMinor,row.currency,row.reason].join('|')))return null;
 s.priceObservations=Array.isArray(s.priceObservations)?s.priceObservations:[];s.priceObservations.push(row);
 if(row.currency===s.currency&&!(s.priceHistory||[]).some(p=>p.at===row.observedAt&&p.minor===row.amountMinor))s.priceHistory.push({at:row.observedAt,minor:row.amountMinor});
 return row;
}

  share:o.share||null,
  amountMinor:o.amountMinor,currency:o.currency,cycle:o.cycle,cycleDays:o.cycleDays||null,

  confidence:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),version:1,lastViewedAt:new Date().toISOString(),
  priceHistory:[{at:first,minor:o.amountMinor}],priceObservations:[]};
 s.priceObservations.push(makePriceObservation({observedAt:first,amountMinor:o.amountMinor,currency:o.currency,source:o.source==='gmail'?'receipt':o.source==='google_play'?'google_play':o.source==='apple_import'?'apple_import':o.source==='csv_import'?'csv_import':'manual_edit',reason:'initial'}));
 DB.d.subs.push(s);

/* 과거 결제 이력 소급 생성 — 최대 36건 (3년) 상한 */
function backfillReceipts(s){
 let d=new Date(s.firstBilledAt);const now=new Date();let n=0;
 while(d<=now&&n<36){
  DB.d.receipts.push({id:uid(),subId:s.id,minor:s.amountMinor,cur:s.currency,at:iso(d),est:true});
  if(s.cycle==="weekly")d=new Date(+d+7*DAY);
  else if(s.cycle==="monthly")d=addMonthsClamped(d,1);
  else if(s.cycle==="yearly")d=addMonthsClamped(d,12);
  else d=new Date(+d+(s.cycleDays||30)*DAY);
  n++;
 }
}
function rollForward(){ // 지난 결제일 자동 전진 + 가상 영수증 적립 (T-106 축약)
 let ch=false;const now=new Date();
 DB.d.subs.forEach(s=>{
  if(s.status!=="active"&&s.status!=="trial")return;
  let guard=0;
  while(new Date(s.nextBillingAt)<=now&&guard++<200){
   DB.d.receipts.push({id:uid(),subId:s.id,minor:s.amountMinor,cur:s.currency,at:s.nextBillingAt});
   s.nextBillingAt=iso(computeNextBilling(s.nextBillingAt,s.cycle,s.cycleDays,new Date(+new Date(s.nextBillingAt))));
   ch=true;
  }
  if(s.status==="trial"&&s.trialEndAt&&new Date(s.trialEndAt)<now){s.status="active";ch=true;}
 });
 if(ch)DB.save();
}

/* ---------- 대시보드 집계 (T-010) ---------- */
function dashboard(){
 const base=DB.d.set.base,list=activeSubs();
 let total=0;const excluded=new Set();const byCur={};
 list.forEach(s=>{
  const m=monthlyMinor(s);
  byCur[s.currency]=(byCur[s.currency]||0)+m;
  const c=convert(m,s.currency,base);
  if(c===null)excluded.add(s.currency);else total+=c;
 });
 const upcoming=[...list].sort((a,b)=>new Date(a.nextBillingAt)-new Date(b.nextBillingAt)).slice(0,5);
 // 전월 대비: 지난달 1일 시점에 존재하던 구독 합
 const lm=new Date();lm.setMonth(lm.getMonth()-1);
 let prev=0;
 DB.d.subs.forEach(s=>{
  if(new Date(s.createdAt)>lm)return;
  if(s.status==="canceled"&&s.canceledAt&&new Date(s.canceledAt)<lm)return;
  const hist=s.priceHistory.filter(h=>new Date(h.at)<=lm).pop()||s.priceHistory[0];
  const c=convert(monthlyMinor({...s,amountMinor:hist.minor}),s.currency,base);
  if(c!==null)prev+=c;
 });
 return{total,base,delta:total-prev,firstMonth:prev===0&&total>0,byCur,excluded:[...excluded],upcoming,
  counts:{active:list.filter(s=>s.status==="active").length,trial:list.filter(s=>s.status==="trial").length,paused:pausedSubs().length}};
}

/* ---------- 해지·재청구 확인 상태 (P3) ---------- */
function cancelJourney(id){
 const j=DB.d.journeys&&DB.d.journeys[id];
 return j&&validCancelJourney(j)?j:{status:"unopened",caseState:"CONSIDERING"};
}
function cancellationCaseState(journey){const status=typeof journey==="string"?journey:journey?.status||"unopened";return CANCELLATION_CASE_BY_JOURNEY[status]||"CONSIDERING"}
function cancelStateLabel(status){return t("cancel."+(status||"unopened"))}
function transitionCancelJourney(id,next,at){
 const s=DB.d.subs.find(x=>x.id===id);if(!s||!CANCEL_JOURNEY_STATES.has(next))return null;
 const current=cancelJourney(id),from=current.status;
 const allowed=from==="unopened"?next==="guide_opened":!!(CANCEL_JOURNEY_TRANSITIONS[from]&&CANCEL_JOURNEY_TRANSITIONS[from].has(next));
 if(!allowed)return null;
 const now=(at?new Date(at):new Date()).toISOString();
 const j=Object.assign({},from==="unopened"?{}:current,{status:next,caseState:cancellationCaseState(next)});
 if(next==="guide_opened")j.guideOpenedAt=now;
 if(next==="cancellation_requested")j.requestedAt=now;
 if(next==="awaiting_rebill_check")j.nextCheckAt=s.nextBillingAt||now;
 if(next==="confirmed_no_rebill")j.checkedAt=now;
 if(next==="rebilled")j.rebilledAt=now;
 DB.d.journeys[id]=j;
 const event={guide_opened:"cancel_guide_opened",cancellation_requested:"cancel_requested",awaiting_rebill_check:"cancel_check_pending",confirmed_no_rebill:"cancel_verified_no_rebill",rebilled:"cancel_rebilled"}[next];
 if(event)track(event,{});
 DB.save();return j;
}
function markCancellationRequested(id){return transitionCancelJourney(id,"cancellation_requested")}
function startRebillCheck(id){return transitionCancelJourney(id,"awaiting_rebill_check")}
function confirmNoRebill(id,at){
 const s=DB.d.subs.find(x=>x.id===id),j=cancelJourney(id);if(!s||j.status!=="awaiting_rebill_check")return null;
 const checkedAt=at?new Date(at):new Date();
 if(!Number.isFinite(checkedAt.getTime())||Date.parse(j.nextCheckAt)>checkedAt.getTime())return null;
 const saved=transitionCancelJourney(id,"confirmed_no_rebill",checkedAt);
 if(!saved)return null;
 s.status="canceled";s.canceledAt=checkedAt.toISOString();
 addSaving("cancel",id,yearlyMinor(s),s.currency,{verifiedNoRebill:true,checkedAt:s.canceledAt});
 DB.save();return saved;
}
function reportRebill(id,at){
 const s=DB.d.subs.find(x=>x.id===id),j=cancelJourney(id);if(!s||j.status!=="awaiting_rebill_check")return null;
 const checkedAt=at?new Date(at):new Date();
 if(!Number.isFinite(checkedAt.getTime())||Date.parse(j.nextCheckAt)>checkedAt.getTime())return null;
 const reported=transitionCancelJourney(id,"rebilled",checkedAt);
 if(reported){s.status="active";delete s.canceledAt;DB.save()}return reported;
}

/* ---------- 낭비 감지 (T-204) + 플랜 최적화 (T-307) ---------- */
function detectWaste(){
 const out=[],list=activeSubs(),now=Date.now();
 const receiptCounts=new Map();
 DB.d.receipts.forEach(r=>receiptCounts.set(r.subId,(receiptCounts.get(r.subId)||0)+1));
 duplicateGroups().forEach(({key,subs:g})=>{const cheapest=g.slice().sort((a,b)=>yearlyMinor(a)-yearlyMinor(b))[0];
  const ids=g.map(s=>s.id).sort();
  out.push({id:"dup:"+key+":"+ids[0],kind:"dup",subId:g[0].id,ids,n:g.length,
   text:t("flag.dup",{n:g.length}),gain:yearlyMinor(cheapest),cur:cheapest.currency})});
 const byCat={};list.forEach(s=>{const c=subCat(s);(byCat[c]=byCat[c]||[]).push(s)});
 for(const c in byCat)if(byCat[c].length>=4)
  out.push({id:"cat:"+c,kind:"cat",subId:byCat[c][0].id,text:t("flag.cat",{n:byCat[c].length,c:catName(c)}),
   gain:0,cur:DB.d.set.base});
 list.forEach(s=>{
  const lv=s.lastViewedAt?new Date(s.lastViewedAt).getTime():new Date(s.createdAt).getTime();
  const rc=receiptCounts.get(s.id)||0;
  if(now-lv>90*DAY&&rc>=2)
   out.push({id:"zom:"+s.id,kind:"zombie",subId:s.id,text:t("flag.zombie"),gain:yearlyMinor(s),cur:s.currency});
  // 가족 요금제
  const fo=familyOffer(s);
  if(fo)out.push({id:"fam:"+s.id,kind:"family",subId:s.id,
   text:t("fam.title")+" — "+t("fam.save",{a:fmt(fo.saveYear,fo.cur)}),gain:fo.saveYear,cur:fo.cur});
  // T-307 연간 전환 — 프리셋(USD)을 사용자 통화로 환산해 비교 (BUG-005 수정)
  const cat=CATMAP[s.slug];
  if(s.cycle==="monthly"&&s.status==="active"&&cat&&cat.p){
   const yr=cat.p.find(p=>p.cy==="yearly");
   if(yr){const yrConv=convert(yr.m,"USD",s.currency);
    if(yrConv!==null){const gain=s.amountMinor*12-yrConv;
     if(gain>=s.amountMinor)out.push({id:"ann:"+s.id,kind:"annual",subId:s.id,
       text:t("flag.annual",{a:fmt(gain,s.currency)}),gain,cur:s.currency});}}}
 });
 bundleOffers().forEach(b=>out.push({id:"bun:"+normalizedServiceName(b.name)+":"+normalizedServiceName(b.plan),kind:"bundle",subId:b.ids[0],
  text:t("bundle.title")+" "+b.name+" — "+t("flag.annual",{a:fmt(b.saveYear,b.cur)}),gain:b.saveYear,cur:b.cur}));
 return out.filter(f=>!DB.d.flags[f.id]).sort((a,b)=>{
  const ga=convert(a.gain,a.cur,DB.d.set.base)||0,gb=convert(b.gain,b.cur,DB.d.set.base)||0;return gb-ga;});
}

async function googleApi(path,options){

 if(session)headers.authorization="Bearer "+session;

 try{const response=await fetch(base+path,Object.assign({signal:controller.signal},options||{},{headers}));

function viewCalendar(){
 const y=CALM.getFullYear(),m=CALM.getMonth();
 const first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());
 const subs=activeSubs(),map={};
 subs.forEach(s=>{ // 12개월 전개
  let d=new Date(s.nextBillingAt),g=0;
  const back=new Date(s.nextBillingAt);
  // 과거 방향 채우기(현재 월 표시용)
  let bd=new Date(back);
  while(bd>new Date(y,m-1,1)&&g++<40){
   if(s.cycle==="weekly")bd=new Date(+bd-7*DAY);
   else if(s.cycle==="monthly")bd=addMonthsClamped(bd,-1);
   else if(s.cycle==="yearly")bd=addMonthsClamped(bd,-12);
   else bd=new Date(+bd-(s.cycleDays||30)*DAY);
   const k=iso(bd);(map[k]=map[k]||[]).push(s);
  }
  g=0;
  while(g++<40&&d<new Date(y,m+2,1)){
   const k=iso(d);(map[k]=map[k]||[]).push(s);
   if(s.cycle==="weekly")d=new Date(+d+7*DAY);
   else if(s.cycle==="monthly")d=addMonthsClamped(d,1);
   else if(s.cycle==="yearly")d=addMonthsClamped(d,12);
   else d=new Date(+d+(s.cycleDays||30)*DAY);
  }
 });
 // 이번 주 합계
 const now=new Date(),wS=new Date(now);wS.setDate(now.getDate()-now.getDay());
 let weekTotal=0;
 for(let i=0;i<7;i++){const k=iso(new Date(+wS+i*DAY));(map[k]||[]).forEach(s=>{
   const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)weekTotal+=c})}
 const mn=LANG==="ko"?`${y}년 ${m+1}월`:new Date(y,m,1).toLocaleString("en-US",{month:"long",year:"numeric"});
 let h=`<div class="head"><div><h1>${t("cal.title")}</h1>
   <div class="sub">${t("cal.week")} <b>${fmt(weekTotal,DB.d.set.base)}</b></div></div></div>
  <div class="card"><div class="row between mb">
   <button class="iconbtn" onclick="calMove(-1)" aria-label="이전 달">‹</button>
   <div class="b">${esc(mn)}</div>
   <button class="iconbtn" onclick="calMove(1)" aria-label="다음 달">›</button></div>
  <div class="cal">`;
 (LANG==="ko"?["일","월","화","수","목","금","토"]:["S","M","T","W","T","F","S"]).forEach(d=>h+=`<div class="dow">${d}</div>`);
 const today=iso(new Date());
 const dayTot={};let maxTot=0;
 Object.keys(map).forEach(k=>{let tt=0;map[k].forEach(s=>{const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)tt+=c});
  dayTot[k]=tt;if(tt>maxTot)maxTot=tt});
 for(let i=0;i<42;i++){const d=new Date(+start+i*DAY),k=iso(d),out=d.getMonth()!==m;
  const items=map[k]||[];
  const heat=maxTot>0&&dayTot[k]?Math.max(8,Math.round(dayTot[k]/maxTot*34)):0;
  h+=`<button class="d ${out?"out":""} ${k===today?"today":""}" ${heat?`style="background:color-mix(in srgb,var(--accent) ${heat}%,var(--surface))"`:""} onclick="calDay('${k}')" aria-label="${k}">
   <div>${d.getDate()}</div><div class="pips">`+
   items.slice(0,4).map(s=>`<i class="pip" style="background:${esc(subColor(s))}"></i>`).join("")+
   (items.length>4?`<span class="tiny" style="font-size:8px">+${items.length-4}</span>`:"")+`</div></button>`}
 h+=`</div></div>
 <div class="tiny muted center">${LANG==="ko"?"날짜를 누르면 그날 결제 내역을 볼 수 있어요":"Tap a day to see what's due"}</div>`;
 return h;
}
function calMove(n){CALM=new Date(CALM.getFullYear(),CALM.getMonth()+n,1);render()}
function calDay(k){
 const subs=activeSubs().filter(s=>{
  let d=new Date(s.nextBillingAt),g=0;const target=new Date(k);
  // 정확 일치 탐색 (앞뒤 24회)
  let b=new Date(s.nextBillingAt);
  for(let i=0;i<40;i++){if(iso(b)===k)return true;
   if(s.cycle==="weekly")b=new Date(+b-7*DAY);else if(s.cycle==="monthly")b=addMonthsClamped(b,-1);
   else if(s.cycle==="yearly")b=addMonthsClamped(b,-12);else b=new Date(+b-(s.cycleDays||30)*DAY);
   if(b<new Date(s.firstBilledAt))break;}
  for(let i=0;i<40;i++){if(iso(d)===k)return true;
   if(s.cycle==="weekly")d=new Date(+d+7*DAY);else if(s.cycle==="monthly")d=addMonthsClamped(d,1);
   else if(s.cycle==="yearly")d=addMonthsClamped(d,12);else d=new Date(+d+(s.cycleDays||30)*DAY);}

 let tot=0;subs.forEach(s=>{const c=convert(s.amountMinor,s.currency,DB.d.set.base);if(c)tot+=c});

function toggleAlert(k){DB.d.set.alerts[k]=!DB.d.set.alerts[k];DB.save();render()}
function setAlertDays(v){DB.d.set.alerts.billingDays=Math.min(7,Math.max(1,parseInt(v)||2));DB.save()}
function setBase(v){DB.d.set.base=v;DB.save();toast(t("t.saved"));render()}
function setFont(v){DB.d.set.fontScale=v;DB.save();applyFont();render()}
function applyFont(){document.documentElement.style.fontSize=(15*(DB.d.set.fontScale||1))+"px"}
function setLang(l){LANG=l;DB.d.set.lang=l;document.documentElement.lang=l;DB.save();track("lang_changed",{l});render()}
function setTheme(v){DB.d.set.theme=v;DB.save();applyTheme();track("theme_changed",{v});render()}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");setTheme(cur==="dark"?"light":"dark")}
function applyTheme(){const v=DB.d.set.theme;
 const dark=v==="dark"||(v==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches);
 document.documentElement.setAttribute("data-theme",dark?"dark":"light");
 const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute("content",dark?"#0F1420":"#1F3864")}
function exportCSV(){
 const rows=[["name","amount","currency","cycle","next_billing","status","yearly"]];
 DB.d.subs.forEach(s=>rows.push([subName(s),(s.amountMinor/minorFactor(s.currency)),s.currency,s.cycle,
  s.nextBillingAt,s.status,(yearlyMinor(s)/minorFactor(s.currency))]));
 const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
 const b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="subscrap.csv";a.click();
 track("export_csv",{n:DB.d.subs.length});toast(t("t.saved"));
}

function analyzePurchaseText(text,sourceType){try{const existing=[...importCandidateFingerprints()];PURCHASE_IMPORT_PREVIEW=preparePurchaseImport(text,{sourceType,existingFingerprints:existing});showPurchaseImportPreview(PURCHASE_IMPORT_PREVIEW)}catch(error){toast(purchaseImportErrorText(error.message))}}

function choosePurchaseImportFile(sourceType){const input=document.createElement("input");input.type="file";input.accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain";input.style.display="none";input.onchange=event=>{loadPurchaseImportFile(event,sourceType);setTimeout(()=>input.remove(),0)};document.body.appendChild(input);input.click()}
function loadPurchaseImportFile(ev,sourceType){const f=ev.target.files&&ev.target.files[0];if(!f)return;const ext=(f.name.split(".").pop()||"").toLowerCase();
 if(f.size>PURCHASE_IMPORT_MAX_BYTES||!["csv","tsv","txt"].includes(ext)){toast(f.size>PURCHASE_IMPORT_MAX_BYTES?purchaseImportErrorText("IMPORT_TOO_LARGE"):(LANG==="ko"?"CSV·TSV·TXT 파일만 선택할 수 있어요":"Choose a CSV, TSV or TXT file"));ev.target.value="";return}
 const rd=new FileReader();rd.onload=()=>{analyzePurchaseText(String(rd.result||""),sourceType||"apple_import");ev.target.value=""};rd.onerror=()=>toast(LANG==="ko"?"파일을 읽지 못했어요":"Could not read the file");rd.readAsText(f,"utf-8")}

 a.download="subscrap-backup-"+iso(new Date())+".json";a.click();

function importBackup(ev){
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 if(f.size>5*1024*1024){toast(LANG==="ko"?"백업 파일은 5MB까지 불러올 수 있어요":"Backup files are limited to 5MB");ev.target.value="";return}
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const d=parseBackupDocument(String(rd.result));
   if(!confirm(LANG==="ko"?`지금 데이터를 백업본(구독 ${d.subs.length}개)으로 바꿉니다. 계속할까요?`
     :`Replace current data with backup (${d.subs.length} subs)?`))return;
   if(!saveRecoverySnapshot("restore"))throw new Error("recovery");
   const previous=cloneJSON(DB.d);DB.d=d;
   if(!DB.save()){DB.d=previous;throw new Error("storage")}
   LANG=DB.d.set.lang||LANG;applyTheme();applyFont();
   track("backup_restored",{n:d.subs.length});toast(t("t.restored",{n:d.subs.length}));render();
  }catch(e){toast(LANG==="ko"?"백업 파일이 아니거나 손상됐어요":"Not a valid backup file")}
  ev.target.value="";
 };
 rd.readAsText(f);
}
function importBackupMerge(ev){
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 if(f.size>5*1024*1024){toast(LANG==="ko"?"백업 파일은 5MB까지 불러올 수 있어요":"Backup files are limited to 5MB");ev.target.value="";return}

async function confirmGoogleDiscovery(id,subId,options={}){
 const sub=subId?DB.d.subs.find(s=>s.id===subId&&s.discoveryReview?.candidateId===id):null,session=googleSession();
 if(sub&&sub.discoveryReview.status==='CONFIRMED')return true;
 if(!session)return false;
 try{
  const result=await googleApi('/v1/google/discoveries/confirm',{method:'POST',body:JSON.stringify({discoveryId:id})});
  if(session!==googleSession())return false;
  if(sub){const before=cloneJSON(sub);sub.discoveryReview={...sub.discoveryReview,status:'CONFIRMED',attempts:Math.min(100,sub.discoveryReview.attempts+1),operationId:result.operationId||sub.discoveryReview.operationId||null,serverVersion:Number.isSafeInteger(result.version)?result.version:sub.discoveryReview.serverVersion,updatedAt:new Date().toISOString()};touchPortable(sub);track('discovery_confirmation_reconciled',{attempts:sub.discoveryReview.attempts,dataClass:'unclassified'});if(!DB.save()){Object.keys(sub).forEach(k=>delete sub[k]);Object.assign(sub,before);return false}}
  GOOGLE_DISCOVERIES=GOOGLE_DISCOVERIES.filter(x=>x.id!==id);return true;
 }catch(e){
  if(sub&&session===googleSession()){const before=cloneJSON(sub);sub.discoveryReview={...sub.discoveryReview,status:e.status===409?'CONFLICT':'PENDING',attempts:Math.min(100,sub.discoveryReview.attempts+1),updatedAt:new Date().toISOString()};touchPortable(sub);if(!DB.save()){Object.keys(sub).forEach(k=>delete sub[k]);Object.assign(sub,before)}}
  if(!options.silent)toast(LANG==='ko'?'구독은 저장했고 서버 확인은 자동으로 다시 시도합니다.':'Subscription saved; server confirmation will retry automatically.');return false;
 }
}
async function retryPendingGoogleConfirmations(options={}){
 if(GOOGLE_CONFIRM_RETRY_BUSY||!googleSession()||navigator.onLine===false)return{confirmed:0,pending:0};
 const rows=DB.d.subs.filter(s=>s.discoveryReview?.status==='PENDING').slice(0,20);GOOGLE_CONFIRM_RETRY_BUSY=true;let confirmed=0;
 try{for(const sub of rows){if(!googleSession())break;if(await confirmGoogleDiscovery(sub.discoveryReview.candidateId,sub.id,{silent:true}))confirmed++}}
 finally{GOOGLE_CONFIRM_RETRY_BUSY=false}
 const pending=DB.d.subs.filter(s=>s.discoveryReview?.status==='PENDING').length;
 if(!options.silent&&confirmed)toast(LANG==='ko'?`서버 후보 ${confirmed}건 확인을 마쳤어요`:`Confirmed ${confirmed} server candidates`);

}

function scanPaste(){
 const txt=($("pastebox").value||"");
 const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const found=[];
 lines.forEach(line=>{
  const am=line.match(/(?:US\$|\$|€|£|₩|¥|KRW|USD)\s?([0-9][0-9,]*\.?[0-9]{0,2})/i);
  if(!am)return;
  const raw=am[1].replace(/,/g,"");const val=parseFloat(raw);
  if(!(val>0))return;
  const isK=/₩|KRW/i.test(am[0]),isJ=/¥/.test(am[0]),isE=/€/.test(am[0]),isG=/£/.test(am[0]);
  const cur=isK?"KRW":isJ?"JPY":isE?"EUR":isG?"GBP":"USD";
  let name=line.replace(am[0],"").replace(/[0-9]{2}[-\/.][0-9]{2}([-\/.][0-9]{2,4})?/g,"")
   .replace(/[|,\t]+/g," ").replace(/\s{2,}/g," ").trim().slice(0,40);
  const hit=CATALOG.find(c=>{const n=name.toLowerCase();
   return n.includes(c.n.toLowerCase())||c.a.some(a=>a&&n.includes(a.toLowerCase()))});
  if(hit)name=hit.n;
  if(!name)return;
  found.push({name,slug:hit?hit.s:null,minor:(cur==="KRW"||cur==="JPY")?Math.round(val):Math.round(val*100),cur});
 });
 track("statement_parsed",{n:found.length});
 const box=$("pasteres");
 if(!found.length){box.innerHTML=`<div class="card flat center sm muted">${t("paste.none")}</div>`;return}
 window.__pasteFound=found;
 box.innerHTML=`<div class="sm b mb">${t("paste.found",{n:found.length})}</div>`+
  found.map((f,i)=>`<label class="card flat row" style="cursor:pointer">
   <input type="checkbox" checked id="pk${i}" style="width:20px;height:20px;flex:none">
   <div class="grow"><div class="sm b">${esc(f.name)}</div>
    <div class="tiny muted">${LANG==="ko"?"월간으로 등록돼요":"Added as monthly"}</div></div>
   <div class="sm b">${fmt(f.minor,f.cur)}</div></label>`).join("")+
  `<button class="btn mt" onclick="savePaste()">${t("paste.save")}</button>`;
}
function savePaste(){
 const found=window.__pasteFound||[];let n=0;
 found.forEach((f,i)=>{const cb=$("pk"+i);if(cb&&cb.checked){
  addSub({slug:f.slug,customName:f.slug?null:f.name,amountMinor:f.minor,currency:f.cur,cycle:"monthly"});n++}});
 closeSheet();toast(t("t.imported",{n,s:found.length-n}));render();
}

 ]:[
  ["Where is my data stored?","Everything stays on this device (browser storage). No server, no account. Back up occasionally with Export CSV in Settings."],

  ["Where is my yearly summary?","Settings → 'Your year in subscriptions'."],
  ["Can I see a subscription's history?","Detail view → 'Timeline' shows adds, payments, price changes and cancellation."],

  ["Can I undo a duplicate merge?","Yes. Use 'Undo recent data change' once in Settings. Exporting a backup first gives you an additional copy."],
  ["Where can I see price increases?","Open the subscription → Timeline to see the old amount, new amount and change date."],

async function openSupportCenter(){
 const signed=!!(googleApiBase()&&googleSession()),requestId=uid();let status={status:"UNKNOWN",incidents:[]},tickets=[];
 const policyBase="https://hanksleekorea-boop.github.io/subscrap/docs/";
 const render=()=>{const statusLabel={OPERATIONAL:LANG==="ko"?"정상 운영":"Operational",DEGRADED:LANG==="ko"?"일부 지연":"Degraded",MAJOR_OUTAGE:LANG==="ko"?"중대 장애":"Major outage",UNKNOWN:LANG==="ko"?"상태 확인 불가":"Status unavailable"}[status.status]||status.status;
 openSheet(`<div class="grab"></div><div class="b" style="font-size:18px">🛟 ${LANG==="ko"?"서비스 상태·문의":"Service status & support"}</div>
  <div class="card flat"><div class="row between"><div class="sm b">${LANG==="ko"?"현재 상태":"Current status"}</div><span class="badge ${status.status==="OPERATIONAL"?"green":status.status==="UNKNOWN"?"":"amber"}">${esc(statusLabel)}</span></div>${(status.incidents||[]).filter(row=>row.status!=="RESOLVED").map(row=>`<div class="tiny muted mt">${esc(row.title)} · ${esc(row.publicMessage)}</div>`).join("")||`<div class="tiny muted mt">${LANG==="ko"?"공개된 진행 중 장애가 없습니다.":"No active public incident."}</div>`}</div>
  <div class="card flat"><div class="sm b">${LANG==="ko"?"정책과 자료 권리":"Policies and data rights"}</div><div class="btnrow mt"><a class="btn line sm" target="_blank" rel="noopener noreferrer" href="${policyBase}TERMS.html">${LANG==="ko"?"이용약관":"Terms"}</a><a class="btn line sm" target="_blank" rel="noopener noreferrer" href="${policyBase}PRIVACY.html">${LANG==="ko"?"개인정보":"Privacy"}</a></div><div class="btnrow mt"><a class="btn line sm" target="_blank" rel="noopener noreferrer" href="${policyBase}REFUND_POLICY.html">${LANG==="ko"?"결제·환불":"Billing & refunds"}</a><a class="btn line sm" target="_blank" rel="noopener noreferrer" href="${policyBase}SUPPORT_AND_INCIDENTS.html">${LANG==="ko"?"장애 대응":"Incident response"}</a></div></div>
  ${signed?`<div class="card"><div class="sm b">${LANG==="ko"?"새 문의":"New ticket"}</div><label class="lb" for="support_category">${LANG==="ko"?"분류":"Category"}</label><select class="inp" id="support_category"><option value="bug">${LANG==="ko"?"오류":"Bug"}</option><option value="discovery">${LANG==="ko"?"유료서비스 찾기":"Discovery"}</option><option value="account">${LANG==="ko"?"계정":"Account"}</option><option value="billing">${LANG==="ko"?"결제":"Billing"}</option><option value="privacy">${LANG==="ko"?"개인정보":"Privacy"}</option><option value="accessibility">${LANG==="ko"?"접근성":"Accessibility"}</option><option value="other">${LANG==="ko"?"기타":"Other"}</option></select><label class="lb" for="support_subject">${LANG==="ko"?"제목":"Subject"}</label><input class="inp" id="support_subject" maxlength="100"><label class="lb" for="support_message">${LANG==="ko"?"내용":"Message"}</label><textarea class="inp" id="support_message" rows="5" maxlength="2000"></textarea><label class="row sm mt" style="align-items:flex-start"><input id="support_diag" type="checkbox" style="width:20px;height:20px;flex:none"><span>${LANG==="ko"?"문제 해결을 위해 앱 판·브라우저·언어·화면 크기만 함께 보내는 데 동의합니다. 구독 내용·메일 원문·인증정보는 보내지 않습니다.":"I consent to send only app version, browser, language and screen size. Subscription data, raw mail and credentials are excluded."}</span></label><button class="btn mt" onclick="submitSupportTicket()">${LANG==="ko"?"문의 보내기":"Send ticket"}</button></div>`:`<div class="card flat sm"><div class="b">${LANG==="ko"?"문의하려면 연결한 Google 계정으로 본인을 확인합니다.":"Connect a Google account to verify your identity before sending a ticket."}</div><div class="tiny muted mt">${LANG==="ko"?"상태와 정책은 로그인 없이도 볼 수 있습니다.":"Status and policies remain available without sign-in."}</div></div>`}
  ${tickets.length?`<div class="sm b mb">${LANG==="ko"?"내 문의":"My tickets"}</div>${tickets.slice(0,10).map(row=>`<div class="card flat"><div class="row between"><div class="sm b">${esc(row.subject)}</div><span class="badge">${esc(row.status)}</span></div><div class="tiny muted mt">${esc(row.id)} · ${googleDate(row.createdAt)}</div>${(row.responses||[]).slice(-1).map(answer=>`<div class="sm mt">${esc(answer.message)}</div>`).join("")}</div>`).join("")}`:""}
  <button class="btn ghost mt" onclick="closeSheet()">${t("common.close")}</button>`);$("sheet").dataset.supportRequest=requestId};
 render();
 if(!googleApiBase()||location.protocol==="file:")return;
 try{const response=await fetch(googleApiBase()+"/v1/status",{headers:{accept:"application/json"}}),payload=await response.json();if(response.ok&&payload.data)status=payload.data;if(signed)tickets=await googleApi("/v1/support/tickets")}catch(error){}
 if(!$("sheet").classList.contains("on")||$("sheet").dataset.supportRequest!==requestId)return;
 render();
}
async function submitSupportTicket(){
 const category=$("support_category").value,subject=$("support_subject").value,message=$("support_message").value,consent=$("support_diag").checked;
 if(subject.trim().length<3||message.trim().length<10){toast(LANG==="ko"?"제목 3자·내용 10자 이상 입력해주세요":"Enter at least 3 subject and 10 message characters");return}
 const diagnostics=consent?{appVersion:VERSION,platform:navigator.platform||"unknown",browser:(navigator.userAgent||"").slice(0,120),locale:LANG,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"unknown",online:navigator.onLine,screen:`${screen.width}x${screen.height}`}:{ };
 try{const ticket=await googleApi("/v1/support/tickets",{method:"POST",body:JSON.stringify({category,subject,message,diagnosticConsent:consent,diagnostics})});toast(LANG==="ko"?`문의 ${ticket.id}를 접수했어요`:`Ticket ${ticket.id} received`);await openSupportCenter()}catch(error){toast(error.message)}
}

  <div style="position:fixed;left:16px;right:16px;bottom:calc(24px + var(--safe-b));max-width:688px;margin:0 auto">

}

<script>
/* S1-005 common review contract. Feature remains off unless explicitly built on. */
function unifiedReviewEnabled(){return document.querySelector('meta[name="subscrap-unified-review"]')?.content==='1'}
function candidateReviewModel(item,origin,accounts){
 const local=origin==='local',sourceTypes=local?[item.sourceType]:Array.isArray(item.sourceTypes)?item.sourceTypes:item.source==='multiple'?(item.reasons||[]).flatMap(r=>r==='receipt_signal'?['gmail']:r==='play_subscription'?['play_subscriptions']:r==='play_purchase'?['play_purchases']:[]):[item.source||'unknown'];
 const accountId=item.accountId||item.sourceAccountId||null,account=(accounts||[]).find(a=>a.id===accountId);
 const cycle=item.cycle||item.cadence||null,limitations=[...(item.limitations||[])];
 if(!cycle||['quarterly','irregular'].includes(cycle))limitations.push('billing_cycle_requires_review');
 if(item.kind==='purchase')limitations.push('purchase_not_recurring');
 return{key:(local?'l:':'g:')+item.id,id:item.id,origin,name:String(item.name||''),sourceTypes:sourceTypes.filter(Boolean),accountId,
  accountLabel:local?(LANG==='ko'?'이 기기에서 선택한 파일':'File selected on this device'):account?.email||accountId||(LANG==='ko'?'계정 확인 필요':'Account unknown'),
  evidenceCount:local?1:Number.isSafeInteger(item.evidenceCount)?item.evidenceCount:null,
  amountMinor:Number.isSafeInteger(item.amountMinor)&&item.amountMinor>=0?item.amountMinor:null,currency:item.currency||null,
  occurredAt:item.occurredAt||null,cycle,kind:item.kind||'unknown',confidence:Number.isFinite(item.confidence)&&item.confidence>=0&&item.confidence<=1?item.confidence:null,
  reasons:Array.isArray(item.reasons)?item.reasons:[],limitations:[...new Set(limitations)],reviewState:String(item.reviewState||'NEW').toUpperCase(),original:item};
}
function candidateReviewDetails(item,origin){
 const model=candidateReviewModel(item,origin,DISCOVERY_OVERVIEW.accounts),ko=LANG==='ko';
 const sources=model.sourceTypes.map(s=>s==='apple_import'?'Apple':s==='csv_import'?'CSV':googleSourceLabel(s)).join(' · ');
 const limits=model.limitations.map(s=>s==='purchase_not_recurring'?(ko?'단건 구매일 수 있음':'May be a one-time purchase'):s==='billing_cycle_requires_review'?(ko?'반복 여부·주기 확인 필요':'Verify recurrence and cycle'):s).join(' · ');
 return `<div class="tiny muted mt" data-candidate-contract><div>${ko?'출처':'Source'}: ${esc(sources)} · ${esc(model.accountLabel)}</div><div>${ko?'근거':'Evidence'}: ${model.evidenceCount==null?'—':model.evidenceCount} · ${ko?'확신':'Confidence'}: ${model.confidence==null?'—':Math.round(model.confidence*100)+'%'} · ${esc(cycLabel(model))}</div><div>${ko?'판별 이유':'Reason'}: ${origin==='local'?(ko?'선택 파일의 결제 행':'Payment row in selected file'):esc(googleDiscoveryReason(item))}</div><div>${ko?'한계':'Limit'}: ${esc(limits||(ko?'사용자 확인 전 구독으로 확정하지 않음':'Not a confirmed subscription until reviewed'))}</div></div>`;
}
const UNIFIED_REVIEW={filter:{query:'',source:'all',confidence:'all',state:'NEW',min:'',currency:'all'},limit:50,selected:new Set(),busy:false,notice:'',undo:[],session:null,sequence:0,taskStarted:new Map()};
function markUnifiedReviewTask(key){if(typeof key==='string'&&!UNIFIED_REVIEW.taskStarted.has(key))UNIFIED_REVIEW.taskStarted.set(key,performance.now())}
function unifiedReviewTaskMetrics(){
 const values=DB.d.events.filter(e=>e.n==='discovery_candidate_task_completed'&&Number.isFinite(e.p?.durationMs)&&e.p.durationMs>=0).map(e=>e.p.durationMs).sort((a,b)=>a-b);
 return{count:values.length,medianMs:values.length?values[Math.floor(values.length/2)]:null,p90Ms:values.length?values[Math.min(values.length-1,Math.ceil(values.length*.9)-1)]:null,dataClass:'synthetic_or_local_telemetry'};
}
function unifiedReviewRows(){
 const google=[...GOOGLE_DISCOVERIES,...GOOGLE_REJECTED],seen=new Set(),rows=[];
 for(const [origin,items]of [['google',google],['local',DB.d.importCandidates||[]]])for(const item of items){
  if(!item||typeof item.id!=='string')continue;const row=candidateReviewModel(item,origin,DISCOVERY_OVERVIEW.accounts);
  if(seen.has(row.key))continue;seen.add(row.key);rows.push(row);
 }
 return rows;
}
function filterReviewRows(rows,filter){
 const query=String(filter.query||'').toLowerCase(),min=filter.min===''?null:Number(filter.min);
 return rows.filter(r=>(!query||(r.name+' '+r.accountLabel).toLowerCase().includes(query))&&
  (filter.source==='all'||r.sourceTypes.some(s=>s===filter.source||filter.source==='google_play'&&s.startsWith('play_')))&&
  (filter.state==='all'||r.reviewState===filter.state)&&
  (filter.confidence==='all'||filter.confidence==='high'&&r.confidence!==null&&r.confidence>=.9||filter.confidence==='review'&&(r.confidence===null||r.confidence<.9))&&
  (filter.currency==='all'||r.currency===filter.currency)&&
  (min===null||Number.isFinite(min)&&min>=0&&filter.currency!=='all'&&r.amountMinor!==null&&r.amountMinor/minorFactor(r.currency)>=min));
}
async function openUnifiedReview(refresh=true){
 const session=googleSession(),seq=++UNIFIED_REVIEW.sequence;
 if(UNIFIED_REVIEW.session!==session){UNIFIED_REVIEW.session=session;UNIFIED_REVIEW.undo=[];UNIFIED_REVIEW.selected.clear();GOOGLE_DISCOVERIES=[];GOOGLE_REJECTED=[]}
 renderUnifiedReview();
 if(!refresh||!session)return;
 try{
  const [all,accounts]=await Promise.all([googleApi('/v1/discovery/candidates/review'),googleApi('/v1/google/accounts')]);
  if(!Array.isArray(all)||!Array.isArray(accounts))throw new Error('Invalid review response');
  const candidates=all.filter(c=>c.reviewState!=='REJECTED'),rejected=all.filter(c=>c.reviewState==='REJECTED');
  if(seq!==UNIFIED_REVIEW.sequence||session!==googleSession()||!document.querySelector('[data-unified-review]')||!$('sheet').classList.contains('on'))return;
  GOOGLE_DISCOVERIES=candidates;GOOGLE_REJECTED=rejected;DISCOVERY_OVERVIEW.accounts=accounts;UNIFIED_REVIEW.notice='';renderUnifiedReview();
 }catch(e){if(seq===UNIFIED_REVIEW.sequence&&session===googleSession()&&document.querySelector('[data-unified-review]')){UNIFIED_REVIEW.notice=LANG==='ko'?'서버 후보 갱신 실패. 저장된 파일 후보는 계속 검토할 수 있습니다.':'Server refresh failed. Saved file candidates remain available.';renderUnifiedReview()}}
}
function renderUnifiedReview(){
 const ko=LANG==='ko',state=UNIFIED_REVIEW,all=unifiedReviewRows(),rows=filterReviewRows(all,state.filter),visible=rows.slice(0,state.limit);
 const option=(value,label,current)=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`;
 const select=(id,label,values,current)=>`<label class="grow tiny" for="${id}">${label}<select class="inp" id="${id}" onchange="applyUnifiedFilters()">${values.map(([value,text])=>option(value,text,current)).join('')}</select></label>`;
 let html=`<div data-unified-review><div class="grab"></div><h2 class="b" style="font-size:18px">${ko?'모든 발견 후보 검토':'Review all discoveries'}</h2><p class="sm muted">${ko?'Google·Apple·CSV 결과를 함께 확인합니다. 보류 항목은 상태 필터에서 바로 찾을 수 있습니다.':'Review Google, Apple and CSV together. Use the state filter to see snoozed items now.'}</p><div role="status" class="sm">${esc(state.notice)}</div>
 <form onsubmit="event.preventDefault();applyUnifiedFilters()"><label class="tiny" for="ur-query">${ko?'이름·계정 검색':'Name or account'}</label><div class="row"><input id="ur-query" class="inp" maxlength="80" value="${esc(state.filter.query)}"><button class="btn sm" style="flex-shrink:0;white-space:nowrap" type="submit">${ko?'검색':'Search'}</button></div>
 <div class="row mt" style="gap:8px;flex-wrap:wrap">${select('ur-source',ko?'출처':'Source',[['all',ko?'전체':'All'],['gmail','Gmail'],['google_play','Play'],['apple_import','Apple'],['csv_import','CSV']],state.filter.source)}${select('ur-confidence',ko?'확신':'Confidence',[['all',ko?'전체':'All'],['high',ko?'높음':'High'],['review',ko?'확인 필요':'Needs review']],state.filter.confidence)}${select('ur-state',ko?'상태':'State',[['NEW',ko?'새 후보':'New'],['LATER',ko?'나중에':'Later'],['REJECTED',ko?'제외':'Rejected'],['all',ko?'받아온 전체':'All loaded']],state.filter.state)}</div>
 <div class="row mt" style="gap:8px;flex-wrap:wrap">${select('ur-currency',ko?'금액 필터 통화':'Amount currency',[['all',ko?'전체':'All'],...[...new Set(all.map(r=>r.currency).filter(Boolean))].map(c=>[c,c])],state.filter.currency)}<label class="grow tiny" for="ur-min">${ko?'최소 금액':'Minimum amount'}<input class="inp" id="ur-min" type="number" min="0" step="any" value="${esc(state.filter.min)}" onchange="applyUnifiedFilters()"></label></div></form>
 <div class="row mt" style="gap:6px;flex-wrap:wrap"><button class="btn ghost sm" onclick="selectUnifiedVisible()">${ko?'보이는 후보 선택':'Select visible'}</button><button class="btn ghost sm" onclick="bulkUnifiedReview('LATER')" ${state.busy?'disabled':''}>${ko?'선택 나중에':'Later selected'}</button><button class="btn ghost sm" onclick="bulkUnifiedReview('REJECTED')" ${state.busy?'disabled':''}>${ko?'선택 아님':'Reject selected'}</button><button class="btn ghost sm" onclick="undoUnifiedReview()" ${!state.undo.length||state.busy?'disabled':''}>${ko?'방금 처리 취소':'Undo last review'}</button></div>
 <p class="tiny muted">${ko?'표시':'Showing'} ${visible.length}/${rows.length} · J/K ${ko?'이동':'move'} · A ${ko?'선택':'select'} · X ${ko?'제외':'reject'} · L ${ko?'나중':'later'} · U ${ko?'취소':'undo'}</p>`;
 html+=visible.map(row=>{const item=row.original,attr=`data-review-key="${esc(row.key)}"`,action=(code,label)=>`<button class="btn ghost sm" ${attr} onclick="reviewUnified(this.dataset.reviewKey,'${code}')" ${state.busy?'disabled':''}>${label}</button>`;
  return `<div class="card flat" tabindex="0" data-unified-candidate="${esc(row.key)}" onfocus="markUnifiedReviewTask('${esc(row.key)}')" onpointerdown="markUnifiedReviewTask('${esc(row.key)}')"><label class="row b" style="gap:8px"><input type="checkbox" ${attr} ${state.selected.has(row.key)?'checked':''} onchange="this.checked?UNIFIED_REVIEW.selected.add(this.dataset.reviewKey):UNIFIED_REVIEW.selected.delete(this.dataset.reviewKey)">${esc(row.name)}</label><div class="sm mt">${row.amountMinor!==null&&row.currency?esc(fmt(row.amountMinor,row.currency)):'—'} · ${esc(String(row.occurredAt||'—').slice(0,10))}</div>${candidateReviewDetails(item,row.origin)}<div class="row mt" style="gap:6px;flex-wrap:wrap">${row.reviewState==='REJECTED'?action('RESTORE',ko?'복원':'Restore'):['NEW','LATER'].includes(row.reviewState)?action('CONFIRMED',ko?'맞음·확인':'Yes · verify')+action('EDIT',ko?'수정':'Edit')+action('REJECTED',ko?'아님':'No')+action('LATER',ko?'나중에':'Later'):''}</div></div>`}).join('');
 if(rows.length>visible.length)html+=`<button class="btn ghost" onclick="UNIFIED_REVIEW.limit+=50;renderUnifiedReview()">${ko?'50개 더 보기':'Show 50 more'}</button>`;
 html+=`<button class="btn ghost mt" onclick="closeSheet()">${t('common.close')}</button></div>`;
 openSheet(html);
 $('sheet').scrollTop=0;requestAnimationFrame(()=>{if(document.querySelector('[data-unified-review]'))$('sheet').scrollTop=0});
 $('sheet').onkeydown=e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const nodes=[...document.querySelectorAll('[data-unified-candidate]')],index=nodes.indexOf(document.activeElement),key=e.key.toLowerCase();if(key==='j'||key==='k'){e.preventDefault();nodes[Math.max(0,Math.min(nodes.length-1,index+(key==='j'?1:-1)))]?.focus()}else if(key==='a'){e.preventDefault();selectUnifiedVisible()}else if(key==='x'||key==='l'){e.preventDefault();bulkUnifiedReview(key==='x'?'REJECTED':'LATER')}else if(key==='u'){e.preventDefault();undoUnifiedReview()}};
}
function applyUnifiedFilters(){const f=UNIFIED_REVIEW.filter;for(const [key,id]of [['query','query'],['source','source'],['confidence','confidence'],['state','state'],['currency','currency'],['min','min']])f[key]=String($('ur-'+id)?.value||'');UNIFIED_REVIEW.limit=50;UNIFIED_REVIEW.selected.clear();UNIFIED_REVIEW.notice=f.min!==''&&f.currency==='all'?(LANG==='ko'?'금액을 비교할 통화를 먼저 선택하세요.':'Choose one currency before comparing amounts.'):'';renderUnifiedReview()}
function selectUnifiedVisible(){document.querySelectorAll('[data-unified-candidate] input[type="checkbox"]').forEach(node=>{node.checked=true;UNIFIED_REVIEW.selected.add(node.dataset.reviewKey)})}
function rememberImportConfirmation(id){
 if(!unifiedReviewEnabled())return;
 const item=DB.d.importCandidates.find(c=>c.id===id);if(!item?.confirmationUndo)return;
 UNIFIED_REVIEW.session=googleSession();UNIFIED_REVIEW.undo=[{origin:'local',id,action:'CONFIRMED',afterVersion:item.version}];
 UNIFIED_REVIEW.notice=LANG==='ko'?'구독을 저장했습니다. 검토함에서 방금 확정을 취소할 수 있습니다.':'Subscription saved. Undo last confirmation from the review inbox.';
}
async function applyUnifiedReview(key,action,session){
 if(session!==googleSession()||session!==UNIFIED_REVIEW.session)throw new Error('Review session changed');
 const row=unifiedReviewRows().find(r=>r.key===key);if(!row)throw new Error('Candidate no longer available');
 if(action==='RESTORE'?!['REJECTED','LATER'].includes(row.reviewState):!['NEW','LATER'].includes(row.reviewState))throw new Error('Candidate already reviewed');
 if(row.origin==='local'){
  const before=cloneJSON(row.original),next=setImportCandidateState(row.id,action);if(!next)throw new Error('Candidate action rejected');
  return{key,origin:row.origin,id:row.id,before,afterVersion:next.version};
 }
 if(!session)throw new Error('Sign in required');
 if(!Number.isSafeInteger(row.original.version))throw new Error('Refresh server candidates before review');
 const result=await googleApi('/v1/discovery/candidates/review',{method:'POST',body:JSON.stringify({candidateId:row.id,action,expectedVersion:row.original.version})});
 if(!result?.candidate||!Number.isSafeInteger(result.version))throw new Error('Invalid review response');
 if(session!==googleSession())throw new Error('Review session changed');
 const before=cloneJSON(row.original);GOOGLE_DISCOVERIES=GOOGLE_DISCOVERIES.filter(i=>i.id!==row.id);GOOGLE_REJECTED=GOOGLE_REJECTED.filter(i=>i.id!==row.id);
 if(result.candidate.reviewState==='REJECTED')GOOGLE_REJECTED.push(result.candidate);
 else GOOGLE_DISCOVERIES.push(result.candidate);
 return{key,origin:row.origin,id:row.id,before,action,session,afterVersion:result.version,operationId:result.operationId};
}
async function reviewUnified(key,action){
 if(UNIFIED_REVIEW.busy)return;
 const row=unifiedReviewRows().find(r=>r.key===key);if(!row)return;
 if(action==='EDIT'||action==='CONFIRMED'){if(!['NEW','LATER'].includes(row.reviewState))return;return row.origin==='local'?editImportCandidate(row.id):openGoogleDiscoveryAdd(row.id)}
 return performUnifiedReviews([key],action);
}
async function bulkUnifiedReview(action){return performUnifiedReviews([...UNIFIED_REVIEW.selected],action)}
async function performUnifiedReviews(keys,action){
 if(UNIFIED_REVIEW.busy||!keys.length||!['LATER','REJECTED','RESTORE'].includes(action))return;
 const session=googleSession(),started=performance.now();UNIFIED_REVIEW.busy=true;UNIFIED_REVIEW.undo=[];let failed=0;
 try{for(const key of keys){if(session!==googleSession())break;try{const taskAt=UNIFIED_REVIEW.taskStarted.get(key),row=unifiedReviewRows().find(r=>r.key===key);UNIFIED_REVIEW.undo.push(await applyUnifiedReview(key,action,session));UNIFIED_REVIEW.selected.delete(key);if(keys.length===1&&Number.isFinite(taskAt)){track('discovery_candidate_task_completed',{action,origin:row?.origin||'unknown',durationMs:Math.max(0,Math.round(performance.now()-taskAt)),dataClass:'unclassified'});UNIFIED_REVIEW.taskStarted.delete(key)}}catch(e){failed++}}

 window.addEventListener("load",()=>{
  const swUrl=`sw.js?v=${encodeURIComponent(VERSION)}`;
  navigator.serviceWorker.register(swUrl,{updateViaCache:"none"})
   .then(reg=>reg.update().catch(()=>{}))
   .catch(()=>navigator.serviceWorker.register(swUrl).catch(()=>{}));
 });
}
